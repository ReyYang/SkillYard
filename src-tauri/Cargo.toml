[package]
name = "skillyard"
version = "1.0.1"
description = "SkillYard 本地 Skill 生命周期管理应用"
authors = ["SkillYard contributors"]
edition = "2024"
build = "build.rs"

[lib]
name = "skillyard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# Tauri staticlib 会让无示例的 rustdoc 测试重复链接完整桌面 runtime；业务测试使用正式 application seam。
doctest = false

[dependencies]
dirs = "6"
fs2 = "0.4"
libc = "0.2"
os_info = { version = "3.15.0", default-features = false }
# 0.40.x 的底层构建脚本需要 Rust 1.95；固定到当前 stable 1.94 可构建的系列。
rusqlite = { version = "=0.39.0", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2"
thiserror = "2.0.19"
uuid = { version = "1", features = ["v4"] }
url = "2.5"
# GitHub 归档只需要 ZIP 内建格式与 Deflate，避免引入其他压缩算法。
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"
