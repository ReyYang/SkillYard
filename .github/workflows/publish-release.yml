name: Publish release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 已通过 VM 验收的 Release candidate workflow run ID
        required: true
        type: string
      expected_commit_sha:
        description: 候选 workflow 与 v1.0.1 Tag 必须共同指向的完整 commit SHA
        required: true
        type: string
      expected_zip_sha256:
        description: VM 已验收 ZIP 的 SHA-256
        required: true
        type: string
      tag_name:
        description: 已创建并指向 expected commit 的 Release Tag
        required: true
        default: v1.0.1
        type: string

# 只有正式发布 workflow 可以写 Release；actions:read 仅用于读取指定候选 run。
permissions:
  actions: read
  contents: write

concurrency:
  group: publish-v1.0.1
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTIFACT_NAME: skillyard-1.0.1-macos-aarch64-candidate
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
      EXPECTED_ZIP_SHA256: ${{ inputs.expected_zip_sha256 }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ inputs.tag_name }}
      ZIP_NAME: SkillYard-1.0.1-macos-aarch64.zip
    steps:
      - name: Validate immutable inputs
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_ZIP_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$TAG_NAME" = "v1.0.1"

      # 同时核验 run 本身和 workflow 记录，防止误用其他 workflow 的同名 artifact。
      - name: Verify candidate workflow run
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RUN_JSON="$(gh api "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN_ID")"
          WORKFLOW_ID="$(jq -r '.workflow_id' <<< "$RUN_JSON")"
          WORKFLOW_JSON="$(gh api "repos/$GH_REPO/actions/workflows/$WORKFLOW_ID")"

          jq -e \
            --arg expected_sha "$EXPECTED_COMMIT_SHA" \
            '.status == "completed"
             and .conclusion == "success"
             and .event == "workflow_dispatch"
             and .head_sha == $expected_sha' \
            <<< "$RUN_JSON" >/dev/null
          test "$(jq -r '.path' <<< "$WORKFLOW_JSON")" = ".github/workflows/release-candidate.yml"

      - name: Checkout expected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit and existing Tag
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"
          test "$(git rev-parse "$TAG_NAME^{commit}")" = "$EXPECTED_COMMIT_SHA"

      # 跨 workflow run 下载候选 artifact；此步骤不会重新构建或修改其中的文件。
      - name: Download verified candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: verified-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify candidate files and checksum
        run: |
          set -euo pipefail
          ACTUAL_FILES="$(find verified-candidate -type f -printf '%P\n' | LC_ALL=C sort)"
          EXPECTED_FILES="$(printf '%s\n%s' 'SHA256SUMS.txt' "$ZIP_NAME")"
          test "$ACTUAL_FILES" = "$EXPECTED_FILES"

          (
            cd verified-candidate
            sha256sum -c SHA256SUMS.txt
          )
          RECORDED_SHA="$(awk 'NR == 1 { print $1 }' verified-candidate/SHA256SUMS.txt)"
          RECORDED_NAME="$(awk 'NR == 1 { print $2 }' verified-candidate/SHA256SUMS.txt)"
          test "$(wc -l < verified-candidate/SHA256SUMS.txt | tr -d ' ')" = "1"
          test "$RECORDED_SHA" = "$EXPECTED_ZIP_SHA256"
          test "$RECORDED_NAME" = "$ZIP_NAME"
          test "$(sha256sum "verified-candidate/$ZIP_NAME" | awk '{print $1}')" = "$EXPECTED_ZIP_SHA256"

      - name: Ensure Release does not already exist
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing to replace it." >&2
            exit 1
          fi

      # SHA 文件只用于候选验证；公开 Release 保持一个 ZIP 资产。
      # 先保持 draft，任何上传或后验失败都不会留下对外可见的不完整 Release。
      - name: Create draft GitHub Release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG_NAME" \
            "verified-candidate/$ZIP_NAME" \
            --repo "$GH_REPO" \
            --draft \
            --verify-tag \
            --title "SkillYard 1.0.1" \
            --notes-file docs/releases/v1.0.1.md

      - name: Verify draft assets by downloading them again
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir verified-draft-assets
          gh release download "$TAG_NAME" \
            --repo "$GH_REPO" \
            --dir verified-draft-assets \
            --pattern "$ZIP_NAME"
          test "$(sha256sum "verified-draft-assets/$ZIP_NAME" | awk '{print $1}')" = "$EXPECTED_ZIP_SHA256"

      - name: Publish verified draft
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "$TAG_NAME" \
            --repo "$GH_REPO" \
            --draft=false \
            --latest \
            --verify-tag

      # 发布后再次从公开 Release 端点下载，验证读者实际获得的仍是同一份文件。
      - name: Verify public Release assets
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ACTUAL_ASSETS="$(gh release view "$TAG_NAME" --repo "$GH_REPO" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          test "$ACTUAL_ASSETS" = "$ZIP_NAME"

          mkdir published-assets
          gh release download "$TAG_NAME" \
            --repo "$GH_REPO" \
            --dir published-assets \
            --pattern "$ZIP_NAME"
          test "$(sha256sum "published-assets/$ZIP_NAME" | awk '{print $1}')" = "$EXPECTED_ZIP_SHA256"
