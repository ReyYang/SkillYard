name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

# 候选包用于真实 VM 验收，不因同一分支上的后续触发而取消正在进行的构建。
concurrency:
  group: release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    name: Verify source and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test frontend
        run: pnpm test

      # 候选 run 必须独立证明同一 commit 没有泄露凭据，不能只依赖另一条 CI run。
      - name: Install and run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: 8.30.1

      - name: Scan full Git history
        run: gitleaks git --redact --verbose --log-opts="--all"

  build:
    name: Build macOS Apple Silicon candidate
    needs: quality
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = "arm64"

      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component clippy --component rustfmt
          rustup default 1.94.1

      # 候选 run 自身覆盖完整 Rust 质量门，成功状态才代表该 commit 可发布。
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --locked

      - name: Verify release version
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const packageVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const tauriVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            if (packageVersion !== "1.0.0" || tauriVersion !== "1.0.0") {
              throw new Error(`Expected version 1.0.0, got package=${packageVersion}, tauri=${tauriVersion}`);
            }
          '

      # tauri.conf.json 使用 signingIdentity "-"，生成 ad-hoc signed 的 .app。
      - name: Build production application
        run: pnpm tauri build --bundles app

      - name: Verify application and create release files
        env:
          ZIP_NAME: SkillYard-1.0.0-macos-aarch64.zip
        run: |
          set -euo pipefail
          APP_PATH="target/release/bundle/macos/SkillYard.app"
          BINARY_PATH="$APP_PATH/Contents/MacOS/skillyard"

          test -d "$APP_PATH"
          test -x "$BINARY_PATH"
          test "$(lipo -archs "$BINARY_PATH")" = "arm64"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP_PATH/Contents/Info.plist")" = "1.0.0"
          test "$(plutil -extract LSMinimumSystemVersion raw "$APP_PATH/Contents/Info.plist")" = "14.0"
          codesign --verify --deep --strict "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | grep -F "Signature=adhoc"

          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release/$ZIP_NAME"
          (
            cd release
            shasum -a 256 "$ZIP_NAME" > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )

      # VM 与正式 Release 都必须复用这个 artifact 中的原始文件。
      - name: Upload candidate files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skillyard-1.0.0-macos-aarch64-candidate
          path: |
            release/SkillYard-1.0.0-macos-aarch64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Record candidate identity
        env:
          ZIP_NAME: SkillYard-1.0.0-macos-aarch64.zip
        run: |
          {
            echo "## Release candidate"
            echo
            echo "- Run ID: \`${{ github.run_id }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Asset: \`$ZIP_NAME\`"
            echo "- SHA-256: \`$(awk '{print $1}' release/SHA256SUMS.txt)\`"
          } >> "$GITHUB_STEP_SUMMARY"
