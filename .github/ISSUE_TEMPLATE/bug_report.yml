name: Bug 报告 / Bug report
description: 报告可以稳定复现的 SkillYard 1.0 问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请移除用户名、个人绝对路径、Token 和其他敏感信息。

  - type: input
    id: version
    attributes:
      label: SkillYard 版本
      description: 可在应用中查看，或填写下载的 Release 版本。
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: macos
    attributes:
      label: macOS 版本
      options:
        - macOS 26
        - macOS 15
        - macOS 14
        - 其他
    validations:
      required: true

  - type: dropdown
    id: chip
    attributes:
      label: Mac 芯片
      options:
        - Apple Silicon
        - Intel
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: supported_app
    attributes:
      label: 涉及的 Agent 应用
      options:
        - Codex
        - Claude Code
        - GitHub Copilot
        - 不涉及 Agent 应用
        - 其他
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出最短、可重复的操作步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 截图或补充信息
      description: 可附匿名化截图；不要上传 Central Store、SQLite、完整日志或含个人路径的终端输出。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认问题发生在 macOS 14+ Apple Silicon 的首发支持范围内。
          required: true
        - label: 我已搜索现有 Issue，没有找到相同问题。
          required: true
        - label: 我已移除 Token、密钥、个人路径和其他敏感信息。
          required: true
